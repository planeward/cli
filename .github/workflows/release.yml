name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: write # GitHub release and the `latest` tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # Skips when this version is already on npm (e.g. the first release,
      # published by hand before the trusted publisher existed), so the tag
      # still gets its GitHub release and moves `latest`.
      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
          else
            pnpm publish --no-git-checks --access public
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}

      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin latest
