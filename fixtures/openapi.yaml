      properties:
        id:
          type: string
        slug:
          type: string
          description: Lowercase answer key; defaults to one derived from `id`.
        type:
          type: string
          enum:
            [
              string,
              email,
              phone,
              textarea,
              number,
              boolean,
              hidden,
              select,
              radio,
              multi_select,
              section,
            ]
        label:
          type: string
        required:
          type: boolean
        placeholder:
          type: string
        helperText:
          type: string
        options:
          type: array
          items:
