          type: string
        name:
          type: string
        color:
          type: string
        rank:
          type: integer
          description: Position in the role hierarchy. Higher is higher.
    ProjectLabel:
      type: object
      required: [id, projectId, name, color]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    TaskDescriptionContent:
      type: array
      nullable: true
      description: >
        Plate JSON task RTE document (array of nodes). Canonical store.
        Allowed types, URL rules, and size limits are documented at
        /docs/task-content. Unknown types and unsafe URLs are rejected.
      items:
        type: object
        additionalProperties: true
    TaskWrite:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          description: >
            Plain text used only when descriptionContent is omitted. Converted
            into paragraph nodes. Ignored when descriptionContent is sent.
        descriptionContent:
          $ref: "#/components/schemas/TaskDescriptionContent"
        statusId:
          type: string
        priority:
          type: string
          enum: [NO_PRIORITY, LOW, MEDIUM, HIGH, URGENT]
        startDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        assigneeMembershipIds:
          type: array
          maxItems: 100
          items:
            type: string
        assigneeRoleIds:
          type: array
          maxItems: 100
          items:
            type: string
          description: >
            Workspace role ids from GET /projects/{projectId}/roles. A role
            must have Manage any project,
            or Editor or Project manager access to the project; otherwise the
            request fails with "One or more assignee roles are invalid." On
            update, the list replaces the current roles only when present.
        labelId:
          type: string
          nullable: true
          description: >
            Project label id from GET /projects/{projectId}/labels. A task has
            at most one label. Null clears the label on update.
        parentId:
          type: string
          nullable: true
          description: >
            Makes this task a subtask. The parent must be a top-level task in
            the same project; subtasks are one level deep, so a task that has
            subtasks cannot become one. On update, a new id moves the task to
            that parent and null unlinks it.
    TaskPatch:
      allOf:
        - $ref: "#/components/schemas/TaskWrite"
        - type: object
          properties:
            expectedVersion:
              type: integer
              minimum: 1
              description: >
                The task `version` you last read. When the task has changed
                since, the update is rejected with 409 `Task was modified by
                someone else. Refresh and retry.` Omit it and the last write
                wins.
