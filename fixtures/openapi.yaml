        "200":
          $ref: "#/components/responses/EventRegistrationItem"
  /events/{eventId}/attendance:
    parameters:
      - $ref: "#/components/parameters/EventId"
    put:
      tags: [Events]
      summary: Set one registrant's attendance
      description: >-
        Requires `EVENT_REGISTRATIONS_WRITE` (`CONTACTS_WRITE` also works).
        Send `memberId` (required for app callers) or `contactId`. The
        registrant must be registered. Changing attendance emits
        `event.attendance_classified`. App callers can only use events with
        `showInCommunity` on, and their response leaves out `contact` and
        `opportunityId`.
      operationId: setEventAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventAttendanceSet"
      responses:
        "200":
          $ref: "#/components/responses/EventRegistrationItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Event, member or registration not found, or event not shown in community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Events]
      summary: Import attendance
      description: >-
        Rows match registrants by email. An explicit `status` wins; otherwise
        no `joinedAt` is NO_SHOW, leaving before the event's `offerStartsAt` is
        LEFT_EARLY, and anything else is ATTENDED. Registrants with no row get
        `missing`. More than 200 rows returns `{ jobId }` — poll
        `GET /jobs/{jobId}`.
      operationId: importEventAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                missing:
                  type: string
                  enum: [NO_SHOW, UNCLASSIFIED]
                  default: NO_SHOW
                rows:
                  type: array
                  maxItems: 20000
                  items:
                    type: object
                    required: [email]
                    properties:
                      email:
                        type: string
                      status:
                        type: string
                        nullable: true
                        description: ATTENDED, LEFT_EARLY, NO_SHOW, or UNCLASSIFIED (aliases like "no show" work).
                      joinedAt:
                        type: string
                        format: date-time
                        nullable: true
                      leftAt:
                        type: string
                        format: date-time
                        nullable: true
      responses:
        "200":
          description: Counts after the import
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                        description: Present when the import runs in the background (> 200 rows).
                      counts:
                        $ref: "#/components/schemas/EventAttendanceCounts"
                      unmatchedEmails:
                        type: array
                        description: Emails in the rows that did not register.
                        items:
                          type: string
        "400":
          $ref: "#/components/responses/InvalidWriteBody"
  /forms:
