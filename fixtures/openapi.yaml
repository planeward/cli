openapi: 3.1.0
info:
  title: Planeward API
  version: 1.0.0
  description: >-
    Workspace-scoped public REST API. Authenticate with `x-api-key` or
    `Authorization: Bearer`. A 403 for a missing scope carries `missingScope`,
    the permission key the caller needs (see `ForbiddenError`). Each key or app
    installation is rate limited before the scope check, so every call counts;
    over the limit returns 429 `{ "error": "Too many API requests. Try again
    shortly." }` with `Retry-After` and `X-RateLimit-*` headers. An app whose
    URLs are still localhost answers 403 `{ "error": "This app is in local
    development and only works in its own workspace." }` when called for an
    installation outside its publisher's workspace. A write that conflicts
    with the current state answers 409 `{ "error": "..." }`: for tasks, a
    stale `expectedVersion` or a move into a status at its blocking WIP limit.
servers:
  - url: "{origin}/api/v1"
    variables:
      origin:
        # Overridden at load from NEXT_PUBLIC_WEB_URL when that env is set.
        default: http://localhost:3000
security:
  - ApiKeyHeader: []
  - BearerAuth: []
tags:
  - name: Projects
    description: Workspace projects
  - name: Tasks
    description: Tasks inside a project
  - name: Customers
    description: CRM customers
  - name: Contacts
    description: CRM contacts (people)
  - name: Sequences
    description: Follow-up sequences. A contact can have one open SALES enrollment and one open CLIENT enrollment. Higher priority replaces lower in the same lane.
  - name: Jobs
    description: Background bulk jobs (attendance import, sales import, sequence bulk pause/stop). Contacts read scope.
  - name: Events
    description: Webinars and live sessions with registrations and attendance. Replaces webinar-* and att-* tags.
  - name: Forms
    description: CRM intake forms
  - name: Pipelines
    description: CRM pipelines and stages
  - name: Opportunities
    description: Pipeline deals
  - name: Invoices
    description: CRM invoices
  - name: Payments
    description: CRM payments and completed purchases from any checkout
  - name: Meta
    description: Meta Purchase conversion log, retry, and offline CSV export. Payments read/write scopes.
  - name: Chats
    description: Channels and messages
  - name: Sites
    description: Published sites, pages, and CMS collections. Sites read/write scopes; needs the Sites app and a plan with Sites.
  - name: Embed
    description: Mint embed sessions and list a host-site user's projects
  - name: Community
    description: >
      Community members, channels, messages, courses, progress, badges and
      notifications. Called by community apps with their `pwa_` secret plus the
      `x-planeward-installation` header; scopes are the ones the installer
      granted. Endpoints that act for a member take `memberId` (the community
      membership id).
paths:
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "201":
          $ref: "#/components/responses/ProjectItem"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      responses:
        "200":
          $ref: "#/components/responses/ProjectItem"
    patch:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          $ref: "#/components/responses/ProjectItem"
    delete:
      tags: [Projects]
      summary: Soft-delete a project
      operationId: deleteProject
      responses:
        "200":
          $ref: "#/components/responses/ProjectItem"
  /projects/{projectId}/labels:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      summary: List labels in a project
      operationId: listProjectLabels
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/ProjectLabelList"
  /projects/{projectId}/roles:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      summary: List roles that can be assigned in a project
      operationId: listProjectAssignableRoles
      description: >-
        Workspace roles that can be task assignees in this project: roles with
        Manage any project, or Editor or Project manager access to the project.
        Sorted by rank (highest first), then name. Use `roleId` in
        `assigneeRoleIds`. Needs `PROJECTS_READ` or `TASKS_READ`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/ProjectAssignableRoleList"
  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      summary: List tasks in a project
      operationId: listProjectTasks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - name: parentId
          in: query
          required: false
          description: Only return subtasks of this task.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
    post:
      tags: [Tasks]
      summary: Create a task
      operationId: createTask
      description: >-
        Creating a task directly in a Done status sets `completedAt` and
        schedules auto-archive. A status at its blocking WIP limit answers 409.
        A task created with `parentId` also sends a `task.created` webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskWrite"
      responses:
        "201":
          $ref: "#/components/responses/TaskItem"
        "400":
          $ref: "#/components/responses/TaskBadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/TaskConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      summary: Get a task
      operationId: getTask
      responses:
        "200":
          $ref: "#/components/responses/TaskItem"
    patch:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      description: >-
        All fields are applied in one write with one `version` bump. Moving the
        task to a Done status sets `completedAt` and schedules auto-archive
        (an archived task then answers 404); moving it out clears
        `completedAt`. A status change puts the task at the end of the new
        column. A status at its blocking WIP limit answers 409. Send
        `expectedVersion` to reject the write with 409 when someone else
        changed the task first; omit it and the last write wins.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          $ref: "#/components/responses/TaskItem"
        "400":
          $ref: "#/components/responses/TaskBadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/TaskConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      responses:
        "200":
          $ref: "#/components/responses/TaskItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/CustomerList"
    post:
      tags: [Customers]
      summary: Create a customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWrite"
      responses:
        "201":
          $ref: "#/components/responses/CustomerItem"
  /customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [Customers]
      summary: Get a customer
      operationId: getCustomer
      responses:
        "200":
          $ref: "#/components/responses/CustomerItem"
    patch:
      tags: [Customers]
      summary: Update a customer
      operationId: updateCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWrite"
      responses:
        "200":
          $ref: "#/components/responses/CustomerItem"
    delete:
      tags: [Customers]
      summary: Delete a customer
      operationId: deleteCustomer
      responses:
        "200":
          $ref: "#/components/responses/CustomerItem"
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      operationId: listContacts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - name: customerId
          in: query
          schema:
            type: string
        - name: unlinkedOnly
          in: query
          schema:
            type: boolean
        - name: firstTouchSource
          in: query
          schema:
            $ref: "#/components/schemas/ContactSource"
      responses:
        "200":
          $ref: "#/components/responses/ContactList"
    post:
      tags: [Contacts]
      summary: Create a contact
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactWrite"
      responses:
        "201":
          $ref: "#/components/responses/ContactItem"
  /contacts/{contactId}:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [Contacts]
      summary: Get a contact
      operationId: getContact
      responses:
        "200":
          $ref: "#/components/responses/ContactItem"
    patch:
      tags: [Contacts]
      summary: Update a contact
      operationId: updateContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactPatch"
      responses:
        "200":
          $ref: "#/components/responses/ContactItem"
    delete:
      tags: [Contacts]
      summary: Soft-delete a contact
      operationId: deleteContact
      responses:
        "200":
          $ref: "#/components/responses/ContactItem"
  /contacts/{contactId}/sequence:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [Sequences]
      summary: Get a contact's sequence state
      description: >-
        Open enrollments by lane (`open.SALES`, `open.CLIENT`) and recent ended
        enrollments. Deprecated SALES-shaped fields (`status`, `sequenceId`,
        `sequenceKey`, `currentStep`, `enrollment`) stay at the top level for one
        release. `lane` selects which lane fills those deprecated fields
        (default SALES).
      operationId: getContactSequence
      parameters:
        - name: lane
          in: query
          schema:
            $ref: "#/components/schemas/SequenceLane"
          description: Lane for the deprecated top-level fields. Defaults to SALES.
      responses:
        "200":
          description: Sequence state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ContactSequenceState"
  /contacts/{contactId}/sequence/enroll:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    post:
      tags: [Sequences]
      summary: Enroll a contact in a sequence
      description: >-
        A higher-priority sequence replaces the open enrollment in the same lane
        (which stops with OUTRANKED). Equal or lower priority leaves the open one
        in place. Contacts under 18 without guardian consent are refused. A contact
        can be in one SALES and one CLIENT sequence at the same time.
      operationId: enrollContactSequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceEnroll"
      responses:
        "200":
          description: Enrollment result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [result, enrollment]
                    properties:
                      result:
                        type: string
                        enum:
                          [
                            enrolled,
                            already_enrolled,
                            outranked,
                            replaced,
                            blocked_minor,
                          ]
                      enrollment:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/SequenceEnrollment"
  /contacts/{contactId}/sequence/stop:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    post:
      tags: [Sequences]
      summary: Stop a contact's open sequence
      description: Optional sequenceId only stops that sequence; otherwise lane (default SALES).
      operationId: stopContactSequence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceStop"
      responses:
        "200":
          description: Whether an enrollment was stopped
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [stopped, enrollment]
                    properties:
                      stopped:
                        type: boolean
                      enrollment:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/SequenceEnrollment"
  /contacts/{contactId}/sequence/pause:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    post:
      tags: [Sequences]
      summary: Pause a contact's active sequence for a human
      description: >-
        A paused enrollment still blocks lower-priority sequences in the same
        lane. Optional sequenceId or lane (default SALES).
      operationId: pauseContactSequence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceLaneBody"
      responses:
        "200":
          description: Whether an enrollment was paused
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [paused, enrollment]
                    properties:
                      paused:
                        type: boolean
                      enrollment:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/SequenceEnrollment"
  /contacts/{contactId}/sequence/resume:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    post:
      tags: [Sequences]
      summary: Resume a contact's paused sequence
      description: Optional sequenceId or lane (default SALES).
      operationId: resumeContactSequence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceLaneBody"
      responses:
        "200":
          description: Whether an enrollment was resumed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [resumed, enrollment]
                    properties:
                      resumed:
                        type: boolean
                      enrollment:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/SequenceEnrollment"
  /sequences:
    get:
      tags: [Sequences]
      summary: List sequences
      operationId: listSequences
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Sequences, highest priority first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sequence"
    post:
      tags: [Sequences]
      summary: Create a sequence
      operationId: createSequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceWrite"
      responses:
        "201":
          $ref: "#/components/responses/SequenceItem"
  /sequences/{sequenceId}:
    parameters:
      - $ref: "#/components/parameters/SequenceId"
    get:
      tags: [Sequences]
      summary: Get a sequence
      operationId: getSequence
      responses:
        "200":
          $ref: "#/components/responses/SequenceItem"
    patch:
      tags: [Sequences]
      summary: Update a sequence
      description: Set `archived` to stop new enrollments; open ones keep running.
      operationId: updateSequence
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SequenceWrite"
                - type: object
                  properties:
                    archived:
                      type: boolean
      responses:
        "200":
          $ref: "#/components/responses/SequenceItem"
  /sequences/{sequenceId}/stats:
    parameters:
      - $ref: "#/components/parameters/SequenceId"
    get:
      tags: [Sequences]
      summary: Sequence stats
      description: Open counts plus completed/stopped in the window (default 30 days).
      operationId: getSequenceStats
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Sequence stats
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SequenceStats"
  /sequences/{sequenceId}/enrollments:
    parameters:
      - $ref: "#/components/parameters/SequenceId"
    get:
      tags: [Sequences]
      summary: List sequence enrollments
      operationId: listSequenceEnrollments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED, STOPPED, COMPLETED]
        - name: stopReason
          in: query
          schema:
            $ref: "#/components/schemas/SequenceStopReason"
        - name: pausedBy
          in: query
          schema:
            type: string
          description: Membership id that paused the enrollment.
        - name: endedSince
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SequenceEnrollment"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
  /sequences/{sequenceId}/archive:
    parameters:
      - $ref: "#/components/parameters/SequenceId"
    post:
      tags: [Sequences]
      summary: Archive a sequence
      description: Archived sequences take no new enrollments; open ones keep running.
      operationId: archiveSequence
      responses:
        "200":
          $ref: "#/components/responses/SequenceItem"
  /sequences/{sequenceId}/enrollments/bulk-stop:
    parameters:
      - $ref: "#/components/parameters/SequenceId"
    post:
      tags: [Sequences]
      summary: Bulk-stop enrollments
      description: >-
        Body is enrollmentIds or a filter, plus reason (default MANUAL). More than
        200 matching rows returns `{ jobId }` instead of `{ stopped }`.
      operationId: bulkStopSequenceEnrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceEnrollmentBulk"
      responses:
        "200":
          description: Stopped count or a bulk job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      stopped:
                        type: integer
                      jobId:
                        type: string
  /sequences/{sequenceId}/enrollments/bulk-pause:
    parameters:
      - $ref: "#/components/parameters/SequenceId"
    post:
      tags: [Sequences]
      summary: Bulk-pause enrollments
      description: >-
        Body is enrollmentIds or a filter. More than 200 matching active rows
        returns `{ jobId }` instead of `{ paused }`.
      operationId: bulkPauseSequenceEnrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SequenceEnrollmentBulk"
      responses:
        "200":
          description: Paused count or a bulk job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      paused:
                        type: integer
                      jobId:
                        type: string
  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      summary: Get a bulk job
      description: Poll until status is SUCCEEDED, FAILED, or CANCELLED. Jobs are workspace-scoped.
      operationId: getBulkJob
      responses:
        "200":
          $ref: "#/components/responses/BulkJobItem"
  /events:
    get:
      tags: [Events]
      summary: List events
      description: >
        Requires `EVENTS_READ` (`CONTACTS_READ` or `CONTACTS_WRITE` also work).
        Newest first, with a registration count per event. App callers only see
        events with `showInCommunity` on, without the CRM pipeline, and with
        `formId` / `form` only for a published form shown in community (see
        `Event`).
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Events]
      summary: Create an event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventWrite"
      responses:
        "201":
          $ref: "#/components/responses/EventItem"
        "400":
          $ref: "#/components/responses/InvalidWriteBody"
  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Get an event
      description: >
        Requires `EVENTS_READ` (`CONTACTS_READ` or `CONTACTS_WRITE` also work).
        Includes `counts` by attendance. For app callers an event without
        `showInCommunity` is 404 "Event not shown in community.", and the
        response leaves out the CRM pipeline and any form apps can't see (see
        `Event`).
      operationId: getEvent
      responses:
        "200":
          $ref: "#/components/responses/EventItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Event not found, or not shown in community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Events]
      summary: Update an event
      operationId: updateEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventWrite"
      responses:
        "200":
          $ref: "#/components/responses/EventItem"
        "400":
          $ref: "#/components/responses/InvalidWriteBody"
    delete:
      tags: [Events]
      summary: Delete an event
      description: Deletes its registrations. Contacts and deals stay.
      operationId: deleteEvent
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
  /events/{eventId}/registrations:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: List registrations
      operationId: listEventRegistrations
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - name: attendance
          in: query
          schema:
            $ref: "#/components/schemas/AttendanceStatus"
      responses:
        "200":
          description: Registrations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventRegistration"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
    post:
      tags: [Events]
      summary: Register a member or contact
      description: >-
        Requires `EVENT_REGISTRATIONS_WRITE` (`CONTACTS_WRITE` also works).
        Send `memberId` (required for app callers) or `contactId`. Safe to
        repeat. Returns 201 with `created: true` for a new registration, 200
        with `created: false` when already registered. When the event has a
        pipeline, a new registration opens a deal in its first open stage. App
        callers can only register for events with `showInCommunity` on, and
        their response leaves out `contact` and `opportunityId`. A member
        without a primary contact gets one: their customer's contact with the
        customer's own email if there is one, else a new contact from the
        customer record. Another contact of the customer is never made
        primary, and the customer record is not changed.
      operationId: registerEventContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRegistrationWrite"
      responses:
        "200":
          $ref: "#/components/responses/EventRegistrationResult"
        "201":
          $ref: "#/components/responses/EventRegistrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Event, member or contact not found, or event not shown in community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/MemberContactConflict"
    delete:
      tags: [Events]
      summary: Cancel a member's or contact's registration
      description: >-
        Requires `EVENT_REGISTRATIONS_WRITE` (`CONTACTS_WRITE` also works).
        Pass exactly one of `memberId` (required for app callers) or
        `contactId`. Safe to repeat: `cancelled` is false when there was no
        registration. Emits `event.registration_cancelled`. The contact and
        any deal stay.
      operationId: cancelEventRegistration
      parameters:
        - name: memberId
          in: query
          schema:
            type: string
        - name: contactId
          in: query
          description: Workspace API keys only.
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [eventId, contactId, cancelled]
                    properties:
                      eventId:
                        type: string
                      contactId:
                        type: string
                        nullable: true
                        description: Null when a member had no contact yet.
                      cancelled:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Event or member not found, or event not shown in community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/{eventId}/registrations/{contactId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [Events]
      summary: Get a contact's registration
      description: 404 when the contact is not registered.
      operationId: getEventRegistration
      responses:
        "200":
          $ref: "#/components/responses/EventRegistrationItem"
    patch:
      tags: [Events]
      summary: Update a registration
      description: >-
        Patch attendance, join/leave times, or the linked opportunity. Pass null
        on opportunityId to unlink. Contact and opportunity records stay.
        Changing attendance emits event.attendance_classified.
      operationId: updateEventRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRegistrationPatch"
      responses:
        "200":
          $ref: "#/components/responses/EventRegistrationItem"
        "400":
          $ref: "#/components/responses/InvalidWriteBody"
    delete:
      tags: [Events]
