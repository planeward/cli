          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CollectionEntryWrite:
      type: object
      required: [slug, data]
      properties:
        slug:
          type: string
          maxLength: 80
        data:
          $ref: "#/components/schemas/CollectionItemData"
        seo:
          $ref: "#/components/schemas/SitePageSeo"
        status:
          type: string
          enum: [DRAFT, ARCHIVED]
        publish:
          type: boolean
          description: Also put the saved draft live
    CollectionEntryPatch:
      type: object
      properties:
        slug:
          type: string
          maxLength: 80
        data:
          $ref: "#/components/schemas/CollectionItemData"
        seo:
          $ref: "#/components/schemas/SitePageSeo"
        status:
          type: string
          enum: [DRAFT, ARCHIVED]
        expectedContentVersion:
          type: integer
          minimum: 0
        publish:
          type: boolean
          description: Also put the saved draft live
    CollectionItemIds:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
    CollectionUpsertRow:
      type: object
      required: [slug, data]
      properties:
        slug:
          type: string
        data:
          $ref: "#/components/schemas/CollectionItemData"
        seo:
          $ref: "#/components/schemas/SitePageSeo"
    CollectionUpsertResult:
      oneOf:
        - type: object
          required: [kind, created, updated, failed]
          properties:
            kind:
              type: string
              enum: [inline]
            created:
              type: integer
            updated:
              type: integer
            failed:
              type: array
              items:
                type: object
                properties:
                  row:
                    type: integer
                  slug:
                    type: string
                  message:
                    type: string
        - type: object
          required: [kind, jobId]
          properties:
            kind:
              type: string
              enum: [job]
            jobId:
              type: string
  responses:
    Forbidden:
      description: >
        Missing scope (`missingScope` names it), not an app caller where one
        is required, the module is disabled, or a localhost app called for an
        installation outside its own workspace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    MemberNotActive:
      description: The member is suspended or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MemberContactConflict:
      description: >
        `Member is not active.` (suspended or revoked), or `Member has no
        primary contact.`: the member's customer has no email and already has
        contacts, so none can be picked as the primary contact. Staff set the
        customer's email or primary contact in the CRM.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: >
        `Invalid JSON body.`, a body or query that fails validation (a
        readable message naming the field), neither or both of `memberId` and
        `contactId`, or `contactId` from an app caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TaskBadRequest:
      description: >
        Malformed JSON (`{ "error": "Invalid JSON body." }`), a body that fails
        validation (`ValidationErrorTree`, for example a title over 500
        characters), or a broken task rule (`Error`): an invalid parent,
        assignee, role, priority or description content, or a milestone or
        cycle outside the task's project
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ValidationErrorTree"
    TaskNotFound:
      description: >
        The task, project, status or label is not found in this workspace, or
        the task is archived
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TaskConflict:
      description: >
        `Task was modified by someone else. Refresh and retry.` when
        `expectedVersion` is stale, or `Status "<name>" is at its task limit
        (<n>).` when the target status has a blocking WIP limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        Over the key's rate limit, or over 30 assignee changes a minute per
        key. Carries `Retry-After` and `X-RateLimit-*` headers.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidWriteBody:
      description: >
        Malformed JSON (`{ "error": "Invalid JSON body." }`), or a body that
        fails validation (`ValidationErrorTree`)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ValidationErrorTree"
