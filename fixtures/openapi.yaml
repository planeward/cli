      operationId: getPayment
      responses:
        "200":
          $ref: "#/components/responses/PaymentItem"
    patch:
      tags: [Payments]
      summary: Update a payment
      description: >-
        A new `amount` on a completed payment posts a ledger adjustment and
        re-splits revenue share; `adjustmentNote` records why. `status:
        REFUNDED` on a completed payment runs the full refund (ledger,
        revenue share, plan access). Refunded payments accept only `note` and
        `paidAt`. Invoice payments cannot change `amount` (edit the invoice).
        `customerId` is locked once the payment granted a plan, paid an
        invoice, or posted to the ledger. Changing `amount` and refunding in
        one request is rejected.
      operationId: updatePayment
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PaymentWrite"
                - type: object
                  properties:
                    adjustmentNote:
                      type: string
                      maxLength: 500
