  /meta/conversions/{conversionId}/retry:
    parameters:
      - $ref: "#/components/parameters/ConversionId"
    post:
      tags: [Meta]
      summary: Retry a failed Meta conversion
      operationId: retryMetaConversion
      responses:
        "200":
          $ref: "#/components/responses/MetaConversionItem"
  /channels:
    get:
      tags: [Chats]
      summary: List channels
      operationId: listChannels
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/ChannelList"
    post:
      tags: [Chats]
      summary: Create a channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelWrite"
      responses:
        "201":
          $ref: "#/components/responses/ChannelItem"
  /channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [Chats]
      summary: Get a channel
      operationId: getChannel
      responses:
        "200":
          $ref: "#/components/responses/ChannelItem"
    patch:
      tags: [Chats]
      summary: Update a channel
      operationId: updateChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelWrite"
      responses:
        "200":
          $ref: "#/components/responses/ChannelItem"
  /channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [Chats]
      summary: List channel messages
      operationId: listChannelMessages
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/MessageList"
    post:
      tags: [Chats]
      summary: Create a message
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageWrite"
      responses:
        "201":
          $ref: "#/components/responses/MessageItem"
  /messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [Chats]
      summary: Update a message
      operationId: updateMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageWrite"
      responses:
        "200":
          $ref: "#/components/responses/MessageItem"
    delete:
      tags: [Chats]
      summary: Delete a message
      operationId: deleteMessage
      responses:
        "200":
          $ref: "#/components/responses/MessageItem"
  /embed/projects:
    get:
      tags: [Embed]
      summary: List an embed user's projects
      operationId: listEmbedProjects
      description: >
        Returns non-archived projects owned by the host-site user, with each
        project's statuses. Requires `EMBED_WRITE`. An unknown
        `externalUserId` returns an empty list and `embedUser: null`. Creating
        a task still uses `POST /projects/{projectId}/tasks` and `TASKS_WRITE`.
      parameters:
        - name: externalUserId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/EmbedProjectList"
  /embed/sessions:
    post:
      tags: [Embed]
      summary: Mint an embed session
      operationId: createEmbedSession
      description: >
        Upserts the host-site end-user and returns a short-lived token plus an
        iframe URL. Requires the `EMBED_WRITE` scope. Embed must be enabled
        with at least one allowed origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedSessionWrite"
      responses:
        "201":
          $ref: "#/components/responses/EmbedSessionItem"
  /community/members:
    get:
      tags: [Community]
      summary: List community members
      operationId: listCommunityMembers
      description: >
        Requires `COMMUNITY_MEMBERS_READ`. Members of the workspace's
        community, oldest first. `search` matches only names the response
        shows: username and `displayName` (the customer or contact name is
        searched only when it is the `displayName` fallback). It never matches
        email addresses. Returns
        403 when the Community module is disabled and 404 when the workspace
        has no community.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/CommunityMemberList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Community]
      summary: Get a community member
      operationId: getCommunityMember
      description: Requires `COMMUNITY_MEMBERS_READ`.
      responses:
        "200":
          $ref: "#/components/responses/CommunityMemberItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [Community]
      summary: List messages in a channel
      operationId: listCommunityMessages
      description: >
        Requires `COMMUNITY_MESSAGES_READ` (`COMMUNITY_MESSAGES_WRITE` alone is
        not enough). Newest first, with reaction counts. Only channels
        `@everyone` can view; others are 404 "Channel not found." so private
        channels look missing. Deleted messages are left out. Page with
        `cursor`: pass the previous response's `meta.nextCursor` until it is
        null.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CursorLimit"
      responses:
        "200":
          $ref: "#/components/responses/CommunityMessagePage"
        "400":
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Channel not found, or `@everyone` can't view it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Community]
      summary: Post a message as the app
      operationId: createCommunityAppMessage
      description: >
        Requires `COMMUNITY_MESSAGES_WRITE` and an app caller (`pwa_` secret);
        workspace API keys get 403. The channel must be a text channel in the
        workspace's community. The app posts with the rights of the
        `@everyone` role, after category and channel overwrites; staff roles
        never apply. If `@everyone` can't view the channel the response is 404
        "Channel not found." so private channels look missing. If `@everyone`
        can view but not send messages the response is 403 "This app can't
        post in that channel.". `replyToId` must be a top-level message in the
        same channel (one level of replies). The message is shown live under
        the app's name; members cannot edit it, moderators can delete it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityAppMessageWrite"
      responses:
        "201":
          $ref: "#/components/responses/CommunityAppMessageItem"
        "400":
          description: Invalid body, non-text channel, or invalid reply target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Not an app caller, Community disabled, missing scope, or
            `@everyone` can't send messages in the channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: >
            Channel or reply target not found, or `@everyone` can't view the
            channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/channels:
    get:
      tags: [Community]
      summary: List channels
      operationId: listCommunityChannels
      description: >
        Requires `COMMUNITY_MESSAGES_READ` (`COMMUNITY_MESSAGES_WRITE` also
        works, so an app that only posts can find a channel). Text and app
        channels the `@everyone` role can view, after category and channel
        overwrites, in sidebar order. App channels whose app is uninstalled or
        no longer available are left out. Private channels are never listed. Returns 403 when the
        Community module is disabled and 404 when the workspace has no
        community.
      responses:
        "200":
          $ref: "#/components/responses/CommunityChannelList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/courses:
    get:
      tags: [Community]
      summary: List courses
      operationId: listCommunityCourses
      description: >
        Requires `COURSES_READ` (`COURSE_PROGRESS_WRITE` also works). Published
        courses members can see (sold through at least one product) in sidebar
        order, without their outline. `chapterCount` and `moduleCount` skip
        chapters without modules.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/CommunityCourseList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Community]
      summary: Get a course outline
      operationId: getCommunityCourse
      description: >
        Requires `COURSES_READ` (`COURSE_PROGRESS_WRITE` also works). The
        published course with its chapters and modules in order. Chapters
        without modules are left out, as members see them. Module bodies,
        videos and attachments are not included. Unpublished courses, and
        courses not sold through any product, are 404.
      responses:
        "200":
          $ref: "#/components/responses/CommunityCourseItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Course not found, not published, or not sold through a product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/members/{memberId}/progress:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Community]
      summary: List a member's course progress
      operationId: listCommunityMemberProgress
      description: >
        Requires `COURSES_READ` (`COURSE_PROGRESS_WRITE` also works). One row
        per module the member has started or completed, in courses members can
        see (published and sold through at least one product, as
        `GET /community/courses` lists them). Filter with `courseId`; any
        other course is 404.
      parameters:
        - name: courseId
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/CommunityModuleProgressList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Member or course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/members/{memberId}/progress/{moduleId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/ModuleId"
    put:
      tags: [Community]
      summary: Complete a module for a member
      operationId: completeCommunityModule
      description: >
        Requires `COURSE_PROGRESS_WRITE`. Marks the module complete for the
        member. Safe to repeat: an already completed module keeps its original
        `completedAt`. Works for any module of a course members can see
        (published and sold through at least one product), whatever the
        member's plan. Emits `community.module.completed`, and
        `community.course.completed` when this completes the course, at most
        once per member and course (uncompleting and completing the last module
        again does not repeat it). The member must be `ACTIVE`.
      responses:
        "200":
          $ref: "#/components/responses/CommunityModuleProgressItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Member or module not found, or course not visible to members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/MemberNotActive"
    delete:
      tags: [Community]
      summary: Uncomplete a module for a member
      operationId: uncompleteCommunityModule
      description: >
        Requires `COURSE_PROGRESS_WRITE`. Clears `completedAt` and keeps the
        video position. Safe to repeat. The member must be `ACTIVE`.
      responses:
        "200":
          $ref: "#/components/responses/CommunityModuleProgressItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Member or module not found, or course not visible to members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/MemberNotActive"
  /community/badges:
    get:
      tags: [Community]
      summary: List the app's badges
      operationId: listCommunityBadges
      description: >
        Requires `COMMUNITY_BADGES_WRITE` and an app caller (`pwa_` secret);
        workspace API keys get 403. Badges this app defined in the installing
        workspace, oldest first.
      responses:
        "200":
          $ref: "#/components/responses/CommunityBadgeList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Community]
      summary: Create or update a badge by key
      operationId: upsertCommunityBadge
      description: >
        Requires `COMMUNITY_BADGES_WRITE` and an app caller. `key` is the app's
        stable slug for the badge: posting an existing key updates that badge
        (200), a new key creates one (201). Badges belong to the app in this
        workspace, so they come back with their awards after a reinstall. An
        app can have at most 50 badges per workspace; a new key past that is
        409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityBadgeWrite"
      responses:
        "200":
          $ref: "#/components/responses/CommunityBadgeItem"
        "201":
          $ref: "#/components/responses/CommunityBadgeItem"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The app already has 50 badges in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/badges/{badgeId}:
    parameters:
      - $ref: "#/components/parameters/BadgeId"
    patch:
      tags: [Community]
      summary: Update a badge
      operationId: updateCommunityBadge
      description: >
        Requires `COMMUNITY_BADGES_WRITE` and an app caller. Only the app's own
        badges; others are 404. `key` can't change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityBadgePatch"
      responses:
        "200":
          $ref: "#/components/responses/CommunityBadgeItem"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Badge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Community]
      summary: Delete a badge
      operationId: deleteCommunityBadge
      description: >
        Requires `COMMUNITY_BADGES_WRITE` and an app caller. Deletes the badge
        and every award of it. No `community.badge.revoked` events are sent.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, deleted]
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Badge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/members/{memberId}/badges/{badgeId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/BadgeId"
    put:
      tags: [Community]
      summary: Award a badge to a member
      operationId: awardCommunityBadge
      description: >
        Requires `COMMUNITY_BADGES_WRITE` and an app caller. Safe to repeat: an
        existing award keeps its `awardedAt` and sends no event. A new award
        emits `community.badge.awarded`. The member must be `ACTIVE`.
      responses:
        "200":
          $ref: "#/components/responses/CommunityMemberBadgeItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Member or badge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/MemberNotActive"
    delete:
      tags: [Community]
      summary: Revoke a badge from a member
      operationId: revokeCommunityBadge
      description: >
        Requires `COMMUNITY_BADGES_WRITE` and an app caller. Safe to repeat.
        Removing an existing award emits `community.badge.revoked`. Works for
        members in any status.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [badgeId, memberId, revoked]
                    properties:
                      badgeId:
                        type: string
                      memberId:
                        type: string
                      revoked:
                        type: boolean
                        description: False when the member did not hold the badge.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Member or badge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/notifications:
    post:
      tags: [Community]
      summary: Send a notification to members
      operationId: sendCommunityNotifications
      description: >
        Requires `COMMUNITY_NOTIFICATIONS_WRITE` and an app caller (`pwa_`
        secret); workspace API keys get 403. Sends an in-app notification and
        a push notification to up to 100 members. It never sends email. The
        title is always the app's name: Planeward sets it, and a `title` in
        the body is ignored. `href` is a path in the app. Opening the
        notification opens the app's channel on the community site with the
        app loaded at that path. Members can turn off an app's notifications.
        A member who did is still listed in `accepted`, so the app can't tell
        who muted it. A member gets at most 10 notifications an hour from one
        app; past that the member is skipped with `over_limit`. Send `key`
        when you retry: a member the app already sent that `key` in the last
        24 hours is listed in `accepted` and not notified again. Without
        `key`, a retry notifies again. The response is 200 even when every
        member is skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityNotificationSend"
      responses:
        "200":
          $ref: "#/components/responses/CommunityNotificationSendResultItem"
        "400":
          description: >
            `Invalid JSON body.`, or a body that fails validation (a readable
            message naming the field)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /sites:
    get:
      tags: [Sites]
      summary: List sites
      operationId: listSites
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/SiteList"
    post:
      tags: [Sites]
      summary: Create a site
      description: Creates the site with an empty homepage.
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteWrite"
      responses:
        "201":
          $ref: "#/components/responses/SiteItem"
  /sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Sites]
      summary: Get a site
      operationId: getSite
      responses:
        "200":
          $ref: "#/components/responses/SiteItem"
    patch:
      tags: [Sites]
      summary: Update a site
      operationId: updateSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitePatch"
      responses:
        "200":
          $ref: "#/components/responses/SiteItem"
    delete:
      tags: [Sites]
      summary: Delete a site
      description: Moves the site to trash for 30 days.
      operationId: deleteSite
      responses:
        "200":
          $ref: "#/components/responses/SiteItem"
  /sites/{siteId}/publish:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Publish a site
      description: Publishes draft pages, the header and footer, and collection templates, plus every PUBLISHED collection item with staged changes.
      operationId: publishSite
      responses:
        "200":
          description: The new site version
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SiteVersion"
  /sites/{siteId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Unpublish a site
      operationId: unpublishSite
      responses:
        "200":
          $ref: "#/components/responses/SiteItem"
  /sites/{siteId}/pages:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Sites]
      summary: List pages
      description: Pages in site order. `kind` defaults to PAGE; HEADER and FOOTER are the site chrome, TEMPLATE pages belong to collections.
      operationId: listSitePages
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/SitePageKind"
      responses:
        "200":
          $ref: "#/components/responses/SitePageList"
    post:
      tags: [Sites]
      summary: Create a page
      operationId: createSitePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitePageWrite"
      responses:
        "201":
          $ref: "#/components/responses/SitePageItem"
  /sites/{siteId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Sites]
      summary: Get a page
      description: Includes the draft body tree and `contentVersion`.
      operationId: getSitePage
      responses:
        "200":
          $ref: "#/components/responses/SitePageItem"
    patch:
      tags: [Sites]
      summary: Update a page
      description: "`body` must be a complete body SiteElement tree. Pass `expectedContentVersion` to fail instead of overwriting newer edits. Header, footer, and template pages take `title` and `body` only."
      operationId: updateSitePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitePagePatch"
      responses:
        "200":
          $ref: "#/components/responses/SitePageItem"
    delete:
      tags: [Sites]
      summary: Delete a page
      description: The homepage cannot be deleted.
      operationId: deleteSitePage
      responses:
        "200":
          $ref: "#/components/responses/SitePageItem"
  /sites/{siteId}/collections:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Sites]
      summary: List collections
      operationId: listSiteCollections
      responses:
        "200":
          $ref: "#/components/responses/SiteCollectionList"
    post:
      tags: [Sites]
      summary: Create a collection
      description: Also creates the collection's TEMPLATE page. A PAGE with the same slug acts as the index. Nothing is served until the next site publish.
      operationId: createSiteCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCollectionWrite"
      responses:
        "201":
          $ref: "#/components/responses/SiteCollectionItem"
  /sites/{siteId}/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
    get:
      tags: [Sites]
      summary: Get a collection
      operationId: getSiteCollection
      responses:
        "200":
          $ref: "#/components/responses/SiteCollectionItem"
    patch:
      tags: [Sites]
      summary: Update a collection
      description: Send the full `fields` list. Removing a field keeps its stored values on items. `jsonLd` null removes it.
      operationId: updateSiteCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCollectionPatch"
      responses:
        "200":
          $ref: "#/components/responses/SiteCollectionItem"
    delete:
      tags: [Sites]
      summary: Delete a collection
      description: Deletes its items and template page. Fails while another collection has a reference field pointing at it.
      operationId: deleteSiteCollection
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
  /sites/{siteId}/collections/{collectionId}/items:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
    get:
      tags: [Sites]
      summary: List collection items
      description: Drafts included. `search` matches name or slug.
      operationId: listCollectionItems
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CollectionItemStatus"
      responses:
        "200":
          $ref: "#/components/responses/CollectionEntryList"
    post:
      tags: [Sites]
      summary: Create a collection item
      description: Creates a draft (or ARCHIVED). `publish` true also puts it live. Counts toward the plan's items-per-site limit.
      operationId: createCollectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionEntryWrite"
      responses:
        "201":
          $ref: "#/components/responses/CollectionEntryItem"
  /sites/{siteId}/collections/{collectionId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [Sites]
      summary: Get a collection item
      operationId: getCollectionItem
      responses:
        "200":
          $ref: "#/components/responses/CollectionEntryItem"
    patch:
      tags: [Sites]
      summary: Update a collection item
      description: Edits the draft. `status` DRAFT unpublishes, ARCHIVED hides. `publish` true puts the saved draft live. Without `expectedContentVersion` the current draft is overwritten; a stale one fails.
      operationId: updateCollectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionEntryPatch"
      responses:
        "200":
          $ref: "#/components/responses/CollectionEntryItem"
    delete:
      tags: [Sites]
      summary: Delete a collection item
      description: Also removes it from other items' reference fields.
      operationId: deleteCollectionItem
      responses:
        "200":
          $ref: "#/components/responses/CollectionDeleteResult"
  /sites/{siteId}/collections/{collectionId}/publish:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [Sites]
      summary: Publish collection items
      description: Puts items live now through the currently published template. The site must have been published once. Needs site publish permission.
      operationId: publishCollectionItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemIds"
      responses:
        "200":
          description: Count of items changed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      published:
                        type: integer
  /sites/{siteId}/collections/{collectionId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [Sites]
      summary: Unpublish collection items
      description: Takes items off the live site; they return to DRAFT. Needs site publish permission.
      operationId: unpublishCollectionItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemIds"
      responses:
        "200":
          description: Count of items changed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      unpublished:
                        type: integer
  /sites/{siteId}/collections/{collectionId}/archive:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [Sites]
      summary: Archive collection items
      description: Hides items and takes them off the live site. Archiving live items needs site publish permission.
      operationId: archiveCollectionItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemIds"
      responses:
        "200":
          description: Count of items changed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      archived:
                        type: integer
  /sites/{siteId}/collections/{collectionId}/upsert:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [Sites]
      summary: Upsert collection items
      description: Creates or updates items by `slug`. Existing items keep fields a row leaves out and keep their status; new items are drafts; nothing is published. Up to 200 rows run inline; more return a `jobId` to poll with `GET /jobs/{jobId}`.
      operationId: upsertCollectionItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 20000
                  items:
                    $ref: "#/components/schemas/CollectionUpsertRow"
      responses:
        "200":
          description: Inline result or a background job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CollectionUpsertResult"
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    Search:
      name: search
      in: query
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
    SequenceId:
      name: sequenceId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    FormId:
      name: formId
      in: path
      required: true
      schema:
        type: string
    FormSubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema:
        type: string
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    ExternalRef:
      name: externalRef
      in: path
      required: true
      schema:
        type: string
    ConversionId:
      name: conversionId
      in: path
      required: true
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      description: Community membership id
      schema:
        type: string
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
    BadgeId:
      name: badgeId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `meta.nextCursor`. Omit for the first page.
      schema:
        type: string
    CursorLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    ListMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ForbiddenError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        missingScope:
          type: string
          description: >
            The API permission the caller lacks, as its key (for example
            `EVENTS_READ`). For an app caller it is the first such scope an app
            can be granted (`FORMS_SUBMIT` rather than `FORMS_READ`). Present
            only when the 403 is a missing scope; absent for other 403s such as
            a disabled module.
    ValidationErrorTree:
      type: object
      description: >
        Body of a 400 from a workspace (non-app) write route whose input fails
        validation: Zod's `treeifyError` output. `errors` holds messages for
        the whole body, `properties` a tree per field.
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
    CursorMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page. Null on the last page.
    CommunityChannel:
      type: object
      required: [id, name, slug, description, kind, categoryId, position]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [TEXT, APP]
        categoryId:
          type: string
          nullable: true
        position:
          type: integer
          description: Sidebar order within the category.
    CommunityReactionCount:
      type: object
      required: [emoji, count]
      properties:
        emoji:
          type: string
        count:
          type: integer
          minimum: 1
    CommunityMessageAuthor:
      type: object
      required: [kind, memberId, installationId, name]
      properties:
        kind:
          type: string
          enum: [member, staff, app]
        memberId:
          type: string
          nullable: true
          description: Community membership id when `kind` is `member`.
        installationId:
          type: string
          nullable: true
          description: App installation id when `kind` is `app`.
        name:
          type: string
    CommunityMessage:
      type: object
      required:
        [id, channelId, body, replyToId, createdAt, editedAt, author, reactions]
      properties:
        id:
          type: string
        channelId:
          type: string
        body:
          type: string
        replyToId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        author:
          $ref: "#/components/schemas/CommunityMessageAuthor"
        reactions:
          type: array
          description: One entry per emoji, most used first.
          items:
            $ref: "#/components/schemas/CommunityReactionCount"
    CommunityCourseSummary:
      type: object
      required:
        [
          id,
          title,
          description,
          position,
          chapterCount,
          moduleCount,
          publishedAt,
        ]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        position:
          type: integer
        chapterCount:
          type: integer
        moduleCount:
          type: integer
        publishedAt:
          type: string
          format: date-time
    CommunityCourse:
      allOf:
        - $ref: "#/components/schemas/CommunityCourseSummary"
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/CommunityChapter"
    CommunityChapter:
      type: object
      required: [id, title, position, modules]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
        modules:
          type: array
          items:
            $ref: "#/components/schemas/CommunityModuleOutline"
    CommunityModuleOutline:
      type: object
      required: [id, title, description, durationSeconds, position]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        durationSeconds:
          type: integer
        position:
          type: integer
    CommunityModuleProgress:
      type: object
      required:
        [
          memberId,
          moduleId,
          chapterId,
          courseId,
          completedAt,
          videoPositionSeconds,
        ]
      properties:
        memberId:
          type: string
        moduleId:
          type: string
        chapterId:
          type: string
        courseId:
          type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Null when started but not completed.
        videoPositionSeconds:
          type: integer
    CommunityBadge:
      type: object
      required:
        [
          id,
          appId,
          key,
          name,
          description,
          color,
          iconUrl,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        appId:
          type: string
        key:
          type: string
          description: The app's stable slug for the badge, unique per app and workspace.
        name:
          type: string
        description:
          type: string
        color:
          type: string
          description: Hex color, `#rrggbb`.
        iconUrl:
          type: string
          nullable: true
          description: Signed URL valid for about 1 hour; don't store it. Null without an icon.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommunityBadgeWrite:
      type: object
      required: [key, name, color]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 48
          pattern: "^[a-z0-9][a-z0-9-]*$"
        name:
          type: string
          minLength: 1
          maxLength: 40
        description:
          type: string
          maxLength: 200
          default: ""
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    CommunityBadgePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        description:
          type: string
          maxLength: 200
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    CommunityMemberBadge:
      type: object
      required: [id, appId, key, name, description, color, iconUrl, awardedAt]
      properties:
        id:
          type: string
          description: Badge id
        appId:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        iconUrl:
          type: string
          nullable: true
        awardedAt:
          type: string
          format: date-time
    CommunityNotificationSend:
      type: object
      required: [memberIds, body, href]
      properties:
        memberIds:
          type: array
          minItems: 1
          maxItems: 100
          description: >
            Community membership ids. A repeated id is notified once and
            appears once in the response.
          items:
            type: string
            minLength: 1
            maxLength: 128
        body:
          type: string
          minLength: 1
          maxLength: 280
          description: Plain text, shown as written. Markdown and HTML are not rendered.
        href:
          type: string
          maxLength: 512
          pattern: "^(?![^?]*/(?:\\.|%2[Ee]){1,2}(?:[/?]|$))/(?!/)(?:[A-Za-z0-9\\-._~!$&'()*+,;=:@/?]|%[0-9A-Fa-f]{2})*$"
          description: >
            Path in the app with an optional query, such as `/orders/123`. It
            is resolved against the origin of the app's Experience URL, so `/`
            is the root of that origin. It can't name a host or scheme, and
            can't contain a `#` fragment, `\`, spaces, non-ASCII characters or
            `.` and `..` segments.
        key:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._:-]+$"
          description: >
            Makes a retry safe. A member the app already sent this `key` in
            the last 24 hours is listed in `accepted` and not notified again.
    CommunityNotificationSkipReason:
      type: string
      enum:
        [member_not_found, member_not_active, channel_not_visible, over_limit]
      description: >
        `member_not_found`: the id is not a member of this workspace's
        community. `member_not_active`: the member is suspended or revoked.
        `channel_not_visible`: the app has no channel `@everyone` can view, so
        the notification has nowhere to open. `over_limit`: the member already
        got 10 notifications from this app in the last hour.
    CommunityNotificationSkip:
      type: object
      required: [memberId, reason]
      properties:
        memberId:
          type: string
        reason:
          $ref: "#/components/schemas/CommunityNotificationSkipReason"
    CommunityNotificationSendResult:
      type: object
      required: [accepted, skipped]
      properties:
        accepted:
          type: array
          description: >
            Members the notification was accepted for, in request order.
            Includes members who turned off the app's notifications.
          items:
            type: string
        skipped:
          type: array
          description: Members who got nothing, each with the reason.
          items:
            $ref: "#/components/schemas/CommunityNotificationSkip"
    EventRegistrationWrite:
      description: >
        Exactly one of `memberId` or `contactId`. App callers must send
        `memberId`; a member without a contact gets one created from their
        customer record.
      oneOf:
        - type: object
          required: [memberId]
          additionalProperties: false
          properties:
            memberId:
              type: string
              description: Community membership id. The member must be `ACTIVE`.
        - type: object
          required: [contactId]
          additionalProperties: false
          properties:
            contactId:
              type: string
              description: Workspace API keys only.
    EventAttendanceSet:
      type: object
      description: >
        Exactly one of `memberId` or `contactId`. App callers must send
        `memberId`. The registrant must already be registered.
      required: [attendance]
      properties:
        memberId:
          type: string
        contactId:
          type: string
          description: Workspace API keys only.
        attendance:
          $ref: "#/components/schemas/AttendanceStatus"
        joinedAt:
          type: string
          format: date-time
          nullable: true
        leftAt:
          type: string
          format: date-time
          nullable: true
    MemberFormSubmissionWrite:
      type: object
      required: [memberId, fields]
      properties:
        memberId:
          type: string
          description: >
            Community membership id. The member must be `ACTIVE`. The
            submission links to the member's contact (created from their
            customer record when missing) and customer.
        fields:
          type: object
          description: >
            Answers keyed by field `slug` (or `id`), validated against the
            form's `fields` definition like a public submission. Send a string
            for text, email, phone, textarea, hidden, select and radio fields
            (an option `value` for the last two), a number for number fields,
            a boolean for boolean fields and an array of option values for
            multi_select. Unknown keys are ignored.
          additionalProperties:
            $ref: "#/components/schemas/FormAnswerValue"
    Project:
      type: object
      required: [id, workspaceId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        categoryId:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectWrite:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
    Task:
      type: object
      required:
        [id, workspaceId, projectId, title, statusId, createdAt, updatedAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        projectId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
          description: Plain text derived from descriptionContent on every write.
        descriptionContent:
          $ref: "#/components/schemas/TaskDescriptionContent"
        statusId:
          type: string
        parentId:
          type: string
          nullable: true
          description: The parent task when this task is a subtask.
        priority:
          type: string
          enum: [NO_PRIORITY, LOW, MEDIUM, HIGH, URGENT]
        startDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Set when the task enters a Done status (from the app, REST, MCP or
            a status-type change) and cleared when it leaves one. Auto-archive
            is scheduled from this time; archived tasks are no longer returned.
        version:
          type: integer
          description: >
            Increments on every write. Send it back as `expectedVersion` on
            PATCH to detect concurrent edits.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        assignees:
          type: array
          items:
            type: object
            required: [membershipId, displayName]
            properties:
              membershipId:
                type: string
              displayName:
                type: string
              image:
                type: string
                nullable: true
        assigneeRoles:
          type: array
          description: Workspace roles assigned to the task. Everyone who holds the role owns the task.
          items:
            type: object
            required: [roleId, name]
            properties:
              roleId:
                type: string
              name:
                type: string
        label:
          allOf:
            - $ref: "#/components/schemas/TaskLabel"
          nullable: true
    TaskLabel:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    ProjectAssignableRole:
      type: object
