  /forms/{formId}/submissions:
    parameters:
      - $ref: "#/components/parameters/FormId"
    get:
      tags: [Forms]
      summary: List submissions for a form
      operationId: listFormSubmissions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: source
          in: query
          schema:
            type: string
            enum: [HOST, SITE, EMBED]
      responses:
        "200":
          $ref: "#/components/responses/FormSubmissionList"
    post:
      tags: [Forms]
      summary: Submit a form as a member
      description: >
        Requires `FORMS_SUBMIT` (`FORMS_WRITE` also works). Submits the
        published form for the member, like a member filling it in: the normal
        form side effects run (`form.submitted`, workflows, event registration
        for a linked event). Consent is never recorded through the API: the
        answers are stored with the submission, but marketing consent,
        guardian consent and the guardian email are not set on the contact.
        A member without a primary contact gets one, as for event
        registration. Callers holding `FORMS_SUBMIT` without `FORMS_READ`
        (every app caller) can only submit forms with `showInCommunity` on.
      operationId: submitFormAsMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberFormSubmissionWrite"
      responses:
        "201":
          $ref: "#/components/responses/FormSubmissionItem"
        "400":
          description: >
            `Invalid JSON body.`, an invalid body (a readable validation
            message), or invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Form or member not found, form not published, or not shown in community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/MemberContactConflict"
  /form-submissions/{submissionId}:
    parameters:
      - $ref: "#/components/parameters/FormSubmissionId"
    get:
