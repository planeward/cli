# `tsc` is TypeScript 7 (native, fast typecheck). Tools that need the
# JavaScript compiler API (ESLint, tsdown) get TypeScript 6 through the
# `typescript` alias and the override below.
overrides:
  typescript: npm:@typescript/typescript6@^6.0.2

allowBuilds:
  esbuild: true

# Our own package: skip the minimum release age so a fresh sdk release can be
# used right away.
minimumReleaseAgeExclude:
  - "@planeward/sdk"
